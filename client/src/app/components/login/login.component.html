<div class="navbar">
    <div class="navbar-brand">Team Discord</div>
        <div class="navbar-links">
            <a href="/Home">Home</a>
            <a href="/account-creation">Account</a>
            <a href="/friend-list">Friends</a>
        </div>
    </div>
  
  <div class="container">
    <h1 class="title">Account Management</h1>

    <!-- Login Form -->
    <div class="form-section">
      <h2>Login</h2>
      <form [formGroup]="userForm" (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" formControlName="username" placeholder="Enter your username" required />
        </div>
  
        <div class="form-group">
          <label for="password">Password:</label>
          <input id="password" type="password" formControlName="password" placeholder="Enter your password" required />
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input id="email" formControlName="email" placeholder="Enter your email" required />
        </div>

        <button type="submit" class="btn btn-secondary">Login</button>
        <p>Don't have an account? Click</p>
        <button class="btn btn-secondary" type="button" (click)="toRegister()">Register</button>
      </form>
    </div>
  </div>
