<!-- Log in formgroup -->
<div
  class="login-container"
  style="background-image: url('./discord-bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;"
>
  <!-- Top-left Discord logo and text -->
  <div class="landing-header">
    <img src="./discord-icon2.png" alt="Discord Logo" class="logo" />
    <span class="logo-text">Discord</span>
  </div>

  <!-- Login form card -->
  <div class="form-card dark">
    <h2 class="form-title">Welcome Back!</h2>
    <p class="form-subtitle">We're so excited to see you again!</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" formControlName="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" required />
      </div>

      <button type="submit" class="discord-btn">Login</button>
    </form>
  </div>
</div>
