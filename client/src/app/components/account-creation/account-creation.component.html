    <a href="/friend-list">Friends</a>

<div class="container">
  <h1 class="title">Account Management</h1>

  <!-- Registration Form -->
  <div class="form-section">
    <h2>Create an Account</h2>
    <form [formGroup]="userForm" (ngSubmit)="register()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input id="username" formControlName="username" placeholder="Enter your username" required />
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input id="email" formControlName="email" placeholder="Enter your email" required />
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
      <p>Already have an account? Click</p>
      <button class="btn btn-secondary" type="button" (click)="toLogin()">Login</button>
    </form>
  </div>

</div>
