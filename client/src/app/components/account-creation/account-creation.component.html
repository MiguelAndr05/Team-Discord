<!-- Create account formgroup -->
<div class="createAccount-container">
  <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()">
      
      <label>User Name</label>
      <input type="text" name="username" id="username" formControlName="username" required />
      
      <label>Email</label>
      <input type="text" name="email" id="create-email" formControlName="email" required />
      
      <label>Phone Number</label>
      <input type="text" name="phonenumber" id="phonenumber" formControlName="phonenumber" />
      
      <label>Password</label>
      <input type="text" name="password" id="create-password" formControlName="password" required />
      
      <button type="submit">Create Account</button>

      <div *ngIf="successMessage" class="success-message">
          <strong>{{successMessage}}</strong>
      </div>

  </form>
</div>
