<div 
  class="account-creation-container"
  style="background-image: url('/discord-bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;"
 
>
  <!-- Top-left Discord logo and text -->
  <div class="landing-header" (click)="toHome()">
    <img src="/discord-icon2.png" alt="Discord Logo" class="logo" />
    <span class="logo-text">Discord</span>
  </div>

  <!-- Form container -->
  <div class="form-card dark">
    <h2 class="form-title">Create an Account</h2>
    <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" formControlName="email" required />
      </div>

      <div class="form-group">
        <label for="phonenumber">Phone Number</label>
        <input type="text" id="phonenumber" formControlName="phonenumber" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" required />
      </div>

      <button type="submit" class="discord-btn">Continue</button>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
    </form>
  </div>
</div>
