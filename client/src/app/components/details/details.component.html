<h4>User Details</h4>

@if(user){
<div>
    <p>
        <label class="bold">
            Username:
        </label>
        {{user.username}}
    </p>
    <p>
        <label class="bold">
            Email:
        </label>
        {{user.email}}
    </p>
    <p>
        <label class="bold">
            Phone No.:
        </label>
        {{user.phonenumber}}
    </p>
</div>
}
